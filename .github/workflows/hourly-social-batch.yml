name: ROZHAN Social 10-Record Hourly Batch

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: rozhanglobal-social-hourly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check AI, search and Gmail configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          YOU_API_KEY: ${{ secrets.YOU_API_KEY }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          test -n "$GEMINI_API_KEY" || { echo "Missing required repository secret: GEMINI_API_KEY"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing required repository secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing required repository secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$YOU_API_KEY" || { echo "Missing required repository secret: YOU_API_KEY"; exit 1; }
          test -n "$GMAIL_USERNAME" || { echo "Missing required repository secret: GMAIL_USERNAME"; exit 1; }
          test -n "$GMAIL_APP_PASSWORD" || { echo "Missing required repository secret: GMAIL_APP_PASSWORD"; exit 1; }

      - name: Run AI-planned discovery (5 Facebook + 5 LinkedIn)
        env:
          LIVE_MODE: ${{ secrets.SOCIAL_LIVE_MODE }}
          COMPOSIO_BASE_URL: ${{ secrets.COMPOSIO_BASE_URL }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_MODEL: ${{ secrets.CLOUDFLARE_AI_MODEL }}
          YOU_API_KEY: ${{ secrets.YOU_API_KEY }}
          YOU_SEARCH_URL: ${{ secrets.YOU_SEARCH_URL }}
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
        run: python -m src.run_hourly_batch

      - name: Validate discovered lead count and targeting
        run: |
          python - <<'PY'
          import csv
          from collections import Counter
          with open('data/social_leads.csv', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          run_id = '${{ github.run_id }}'
          fresh = [r for r in rows if r.get('run_id') == run_id]
          counts = Counter(r.get('platform') for r in fresh)
          print('run_id=', run_id)
          print('lead_records=', len(fresh), 'facebook=', counts.get('facebook', 0), 'linkedin=', counts.get('linkedin', 0))
          print('country=', sorted({r.get('country') for r in fresh}))
          print('sectors=', sorted({r.get('sector') for r in fresh}))
          assert len(fresh) == 10, f'Expected 10 lead records, got {len(fresh)}'
          assert counts.get('facebook', 0) == 5, 'Expected 5 Facebook lead records'
          assert counts.get('linkedin', 0) == 5, 'Expected 5 LinkedIn lead records'
          assert all(r.get('url') for r in fresh), 'Every discovered lead must have a URL'
          assert len({r.get('sector') for r in fresh}) == 1, 'One AI-selected sector should drive the hourly batch'
          assert all(r.get('country') == 'China' for r in fresh), 'Target country must be China'
          PY

      - name: Generate personalized email drafts / send eligible business emails
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_MODEL: ${{ secrets.CLOUDFLARE_AI_MODEL }}
          YOU_API_KEY: ${{ secrets.YOU_API_KEY }}
          YOU_SEARCH_URL: ${{ secrets.YOU_SEARCH_URL }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SEND_EMAILS: ${{ secrets.SEND_EMAILS }}
          MAX_EMAILS_PER_RUN: '10'
        run: python -c "from src.email_outreach import process_run; import os; process_run(os.environ['GITHUB_RUN_ID'])"

      - name: Save state
        run: |
          git config user.name "rozhanglobal-social-automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update social discovery and outreach state"
          git push
